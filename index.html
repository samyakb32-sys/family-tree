<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhadke Family Tree</title>
<meta name="description" content="Bhadke parivar ki vanshavali — interactive family tree.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Noto+Serif+Devanagari:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="vp" aria-label="Family tree">
  <div id="world">
    <svg id="lines" aria-hidden="true"></svg>
    <div id="cards"></div>
  </div>
</div>

<header id="top">
  <div class="brand">
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M16 29V15M16 15C16 9 9 9 7 4M16 15c0-6 7-6 9-11M16 22c0-4-5-4-7-7M16 22c0-4 5-4 7-7"/>
      </svg>
    </div>
    <div>
      <h1>Bhadke Family Tree</h1>
      <p class="deva">वंशावली</p>
    </div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Naam search karo…  ( / )" autocomplete="off" spellcheck="false">
    <ul id="results" hidden></ul>
  </div>

  <div class="stats" id="stats"></div>
</header>

<div class="tools" role="toolbar" aria-label="Tree controls">
  <button id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <button id="zout" title="Zoom out (-)" aria-label="Zoom out">−</button>
  <button id="fit" title="Poora tree dikhao (0)" aria-label="Fit to screen">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="expand" title="Sab kholo" aria-label="Expand all">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l5-5 5 5M7 16l5 5 5-5"/></svg>
  </button>
  <button id="collapse" title="Sab band karo" aria-label="Collapse all">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l5 5 5-5M7 20l5-5 5 5"/></svg>
  </button>
  <button id="theme" title="Theme badlo" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>
  </button>
</div>

<aside id="panel" aria-live="polite" hidden></aside>

<div class="hint" id="hint">Drag karke ghumao · Scroll / pinch se zoom · Card par click karke details dekho</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
